<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="page">
  <header class="header">
    <img src="./eisenhower-matrix.jpg" class="header__image" alt="eisenhower matrix">
    <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="main">
    <section id="top">
      <h3 class="first heading">Add Item</h3>
      <div class="task-row-wrapper">
        <input id="new-task" class="task" type="text">
        <button class="button">Add</button>
      </div>
    </section>
    <section class="todo">
      <h3 class="heading">Todo</h3>
      <ul id="incomplete" class="list">
        <li class="list-item">
          <input type="checkbox" class="list-item__input">
          <label class="list-item_label task">Pay Bills</label>
          <input type="text" class="task">
          <button class="list-item__button edit">Edit</button>
          <button class="list-item__button delete">
            <img class="delete-image" src="./remove.svg" alt=""> <!-- If alt is redundant for a picture, or if it is used only for decorative purposes use the empty alternate text alt="". -->
          </button>
        </li>
        <li class="list-item edit">
          <input type="checkbox" class="list-item__input">
          <label class="list-item_label task">Go Shopping</label>
          <input type="text" value="go shopping" class="task">
          <button class="list-item__button edit">Save</button>
          <button class="list-item__button delete">
            <img class="delete-image" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>
    <section class="completed">
      <h3 class="heading">Completed</h3>
      <ul id="completed" class="list">
        <li class="list-item">
          <input type="checkbox" checked class="list-item__input list-item__input_checked">
          <label class="list-item_label task">See the Doctor</label>
          <input type="text" class="task">
          <button class="list-item__button edit">Edit</button>
          <button class="list-item__button delete">
            <img class="delete-image" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
